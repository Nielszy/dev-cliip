---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netbox
configMapGenerator:
  - name: netbox-helm-values
    files:
      - values.yaml=netbox-helm-values.yaml
resources:
  - ../../base/netbox
  - netbox-superuser-secret.yaml
  - netbox-helmRelease.yaml
configurations:
  - kustomize-nameReference.yaml
