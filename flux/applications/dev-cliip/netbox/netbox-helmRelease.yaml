---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: netbox
spec:
  interval: 12h
  # The first start runs all NetBox database migrations, which can take a while.
  timeout: 15m
  chart:
    spec:
      chart: netbox
      version: 8.3.100
      sourceRef:
        kind: HelmRepository
        name: netbox
        namespace: netbox
  # Retry failed installs/upgrades in place instead of uninstalling or rolling
  # back. An uninstall keeps the PostgreSQL PVC but the reinstall generates a
  # new random database password, which then no longer matches the data on the
  # PVC ("password authentication failed for user netbox").
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  valuesFrom:
  - kind: ConfigMap
    name: base-netbox-helm-values
  - kind: ConfigMap
    name: netbox-helm-values
