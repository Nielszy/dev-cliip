---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clab-gitlab-runner
  namespace: clab-gitlab-runner
spec:
  interval: 24h
  chart:
    spec:
      chart: gitlab-runner
      version: 0.82.0
      sourceRef:
        kind: HelmRepository
        name: gitlab-runner
        namespace: gitlab-runner
  upgrade:
    crds: CreateReplace
  install:
    createNamespace: true
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    remediation:
      retries: 5
  valuesFrom:
  - kind: ConfigMap
    name: base-gitlab-runner-helm-values
    optional: true
  - kind: ConfigMap
    name: clab-gitlab-runner-helm-values
