---
prometheus:
  route:
    main:
      enabled: true
      hostnames:
        - prometheus.dev-cliip.test
      parentRefs:
        - name: dev-cliip
          namespace: envoy-gateway-system
  prometheusSpec:
    # Enable the TSDB admin API so series can be deleted without replacing
    # the Prometheus volume. Only acceptable in this local lab.
    enableAdminAPI: true
    retention: 1d
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
          selector:
            matchLabels:
              application: prometheus
    externalLabels:
      cluster: dev-cliip
grafana:
  # Newer chart versions (e.g. v92.18.0) no longer default the admin password
  # to "prom-operator" (v77.13.0 did) and generate a random one instead. Pin
  # the password documented in the README for this local lab.
  adminPassword: prom-operator
  route:
    main:
      enabled: true
      hostnames:
        - grafana.dev-cliip.test
      parentRefs:
        - name: dev-cliip
          namespace: envoy-gateway-system
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      # Put a dashboard in the Grafana folder named in the grafana_folder
      # annotation of its ConfigMap. Dashboards without it stay in General.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
alertmanager:
  route:
    main:
      enabled: true
      hostnames:
        - alertmanager.dev-cliip.test
      parentRefs:
        - name: dev-cliip
          namespace: envoy-gateway-system
cleanPrometheusOperatorObjectNames: true
