# Cilium needs to run before everything else.
# All other Kustomizations depend on the infrastructure-cilium Kustomization.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-cilium
  namespace: flux-system
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/dev-cliip/components/cilium
  wait: true
  prune: true
# Envoy Gateway installs the Gateway API CRDs and needs to run before the Gateway is created.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-envoy-gateway
  namespace: flux-system
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: infrastructure-cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/dev-cliip/components/envoy-gateway
  wait: true
  prune: true
# The Gateway needs to run before other applications that use HTTPRoutes.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-gateway
  namespace: flux-system
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 5m
  dependsOn:
    - name: infrastructure-envoy-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/dev-cliip/components/gateway
  wait: true
  prune: true
# After Cilium and the Gateway are running and ready, the other infra related applications should be installed.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-gateway
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/dev-cliip/components/monitoring
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-sealed-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-gateway
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/dev-cliip/components/sealed-secrets
  prune: true
