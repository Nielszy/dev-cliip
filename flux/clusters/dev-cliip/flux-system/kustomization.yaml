apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
  # Retry a Kustomization whose dependencies are not ready yet after 10s
  # instead of the default 30s, so the dependency chain reconciles faster.
  - patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --requeue-dependency=10s
    target:
      kind: Deployment
      name: kustomize-controller
