---
vmType: vz
memory: 16GiB
cpus: 4
images:
  - location: https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-genericcloud-arm64-20261103-2651.qcow2
    arch: aarch64
networks:
   - lima: user-v2
mounts:
  # Only adjust the `location` paths. Lima fills in {{.Home}} with the home directory of the user in the VM.
  # Adjust the `location` path to where you cloned your forked dev-cliip repo.
  - location: "/Users/USER/dev-cliip"
    mountPoint: "{{.Home}}/dev-cliip"
    writable: true
  # Adjust the `location` path to where your cEOS ARM image is stored.
  - location: "/Users/USER/container-images"
    mountPoint: "{{.Home}}/container-images"
